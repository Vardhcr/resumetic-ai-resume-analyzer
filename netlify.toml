[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Vite 8 requires Node 20.19+ or 22.12+. Pin a compatible version so Netlify
# does not fall back to an older default Node and fail the build silently
# (which previously left the stale, pre-mobile-fix bundle live).
[build.environment]
  NODE_VERSION = "22.12.0"

